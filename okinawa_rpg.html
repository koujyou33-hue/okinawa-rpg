<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>琉球タイムトラベル RPG ～王宇翔の沖縄探求～</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap');

:root{
  --coral:#E8604C; --ocean:#1A7AB5; --sand:#F5E6C8;
  --deep:#0e1628; --gold:#D4A843; --teal:#2E8B82;
  --light:#FFF8EE; --hibiscus:#E8324C; --ryukyu:#8B2252;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Noto Sans JP',sans-serif;
  background:var(--deep); color:var(--light);
  min-height:100vh; overflow-x:hidden;
}

/* ====== GLOBAL BG ====== */
.global-bg{
  position:fixed;inset:0;z-index:0;
  background:linear-gradient(160deg,#060d1f 0%,#0e1a35 35%,#071520 65%,#050f18 100%);
}
/* Ocean shimmer */
.global-bg::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:35%;
  background:linear-gradient(0deg,rgba(10,60,100,.55) 0%,transparent 100%);
  animation:oceanShimmer 6s ease-in-out infinite alternate;
}
@keyframes oceanShimmer{0%{opacity:.7;}100%{opacity:1;}}

/* Stars */
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
.star{
  position:absolute;background:#fff;border-radius:50%;
  animation:twinkle var(--dur) ease-in-out infinite alternate;
}
@keyframes twinkle{0%{opacity:.15;transform:scale(1);}100%{opacity:.95;transform:scale(1.5);}}

/* ====== LAYOUT ====== */
#wrap{
  position:relative;z-index:10;
  max-width:880px;margin:0 auto;
  padding:16px 14px 50px;
  display:flex;flex-direction:column;gap:14px;
}

/* ====== HEADER ====== */
.hdr{text-align:center;padding:18px 0 6px;}
.hdr-title{
  font-family:'Noto Serif JP',serif;
  font-size:clamp(18px,3.8vw,30px);
  color:var(--gold);
  text-shadow:0 0 24px rgba(212,168,67,.6);
  letter-spacing:.06em;line-height:1.35;
}
.hdr-sub{font-size:12px;color:rgba(255,255,255,.5);margin-top:5px;letter-spacing:.12em;}

/* ====== PROGRESS ====== */
.prog-row{display:flex;align-items:center;gap:10px;padding:0 2px;}
.prog-lbl{font-size:11px;color:var(--gold);font-weight:700;white-space:nowrap;}
.prog-bg{flex:1;height:9px;background:rgba(255,255,255,.09);border-radius:5px;overflow:hidden;border:1px solid rgba(212,168,67,.18);}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:5px;transition:width .6s ease;width:0%;}
.score-lbl{font-size:12px;color:var(--gold);font-weight:700;white-space:nowrap;}
.dots{display:flex;justify-content:center;gap:7px;padding:2px 0;}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.13);border:1.5px solid rgba(255,255,255,.18);transition:all .3s;}
.dot.active{background:var(--gold);border-color:var(--gold);box-shadow:0 0 7px var(--gold);}
.dot.done{background:var(--teal);border-color:var(--teal);}

/* ====== SCENE CARD ====== */
.card{
  background:linear-gradient(145deg,rgba(255,248,238,.055),rgba(255,248,238,.018));
  border:1px solid rgba(212,168,67,.22);border-radius:22px;overflow:hidden;
  backdrop-filter:blur(12px);
  box-shadow:0 10px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.045);
  animation:cardIn .45s ease;
}
@keyframes cardIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

/* ====== STAGE BANNER ====== */
.s-banner{
  padding:13px 22px;display:flex;align-items:center;gap:11px;
  border-bottom:1px solid rgba(212,168,67,.18);
}
.s-banner.b1{background:linear-gradient(135deg,rgba(110,60,20,.45),rgba(200,140,50,.2));}
.s-banner.b2{background:linear-gradient(135deg,rgba(20,90,160,.45),rgba(40,130,120,.2));}
.s-banner.b3{background:linear-gradient(135deg,rgba(180,60,50,.45),rgba(200,140,50,.2));}
.s-banner.bR{background:linear-gradient(135deg,rgba(180,130,30,.3),rgba(40,130,120,.2));}
.s-ico{font-size:26px;}
.s-num{font-size:10px;color:rgba(255,255,255,.45);letter-spacing:.15em;}
.s-name{font-family:'Noto Serif JP',serif;font-size:16px;color:var(--gold);font-weight:700;margin-top:1px;}
.s-era{font-size:10px;color:rgba(255,255,255,.5);margin-top:2px;}

/* ====== CSS SCENE ART ====== */
.scene-art{width:100%;height:190px;position:relative;overflow:hidden;}

/* --- SCENE 1: 首里城 --- */
.art-shuri{background:linear-gradient(180deg,#0d1830 0%,#1a2a4a 25%,#c45f20 58%,#8B3a10 75%,#5a2008 100%);}
/* Sky stars */
.art-shuri .sky-star{position:absolute;background:#fffde0;border-radius:50%;animation:twinkle var(--dur) ease-in-out infinite alternate;}
/* Moon */
.art-shuri .moon{
  position:absolute;top:14px;right:55px;
  width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 38% 38%,#fffff0,#e8d870);
  box-shadow:0 0 18px 6px rgba(255,250,180,.35);
}
/* Castle base */
.art-shuri .castle-base{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:320px;height:90px;
  background:linear-gradient(180deg,#c0401a 0%,#8c2c0e 55%,#5a1c06 100%);
  border-radius:4px 4px 0 0;
}
/* Roof tier 1 */
.art-shuri .roof1{
  position:absolute;bottom:82px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:170px solid transparent;
  border-right:170px solid transparent;
  border-bottom:44px solid #c0401a;
  filter:drop-shadow(0 -3px 6px rgba(200,80,20,.4));
}
/* Roof tier 2 */
.art-shuri .roof2{
  position:absolute;bottom:110px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:110px solid transparent;
  border-right:110px solid transparent;
  border-bottom:36px solid #d44e22;
}
/* Top spire */
.art-shuri .spire{
  position:absolute;bottom:140px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:55px solid transparent;
  border-right:55px solid transparent;
  border-bottom:30px solid #e8602a;
}
/* Windows */
.art-shuri .win{
  position:absolute;background:#ffcc44;
  width:12px;height:16px;border-radius:2px 2px 0 0;
  box-shadow:0 0 6px rgba(255,200,50,.6);
}
/* Trees */
.art-shuri .tree{
  position:absolute;bottom:0;
  width:22px;height:50px;background:linear-gradient(180deg,#1a6b1a,#0d4a0d);
  border-radius:50% 50% 5px 5px;
}
/* Ground */
.art-shuri .ground{
  position:absolute;bottom:0;left:0;right:0;height:22px;
  background:linear-gradient(90deg,#3a2010,#5a3018,#3a2010);
}
/* Lanterns */
.art-shuri .lantern{
  position:absolute;background:radial-gradient(#ff6644,#cc2200);
  width:10px;height:14px;border-radius:50%;
  box-shadow:0 0 8px rgba(255,80,30,.7);
  animation:lanternSwing 3s ease-in-out infinite alternate;
  transform-origin:top center;
}
@keyframes lanternSwing{0%{transform:rotate(-8deg);}100%{transform:rotate(8deg);}}

/* --- SCENE 2: 海辺・珊瑚礁 --- */
.art-sea{background:linear-gradient(180deg,#0a1f3d 0%,#0d3060 20%,#0d5080 45%,#0d7090 65%,#12a090 80%,#18d0a8 90%,#d4c060 95%,#c8a840 100%);}
/* Sun */
.art-sea .sun{
  position:absolute;top:18px;left:65px;
  width:50px;height:50px;border-radius:50%;
  background:radial-gradient(circle,#fff8c0,#ffcc00,#ff9900);
  box-shadow:0 0 30px 12px rgba(255,200,0,.4);
  animation:sunPulse 4s ease-in-out infinite alternate;
}
@keyframes sunPulse{0%{box-shadow:0 0 25px 8px rgba(255,200,0,.35);}100%{box-shadow:0 0 40px 16px rgba(255,200,0,.5);}}
/* Clouds */
.art-sea .cloud{
  position:absolute;background:rgba(255,255,255,.55);border-radius:50px;
  box-shadow:0 0 0 10px rgba(255,255,255,.25);
}
/* Waves */
.art-sea .wave{
  position:absolute;border-radius:50%;
  border:3px solid rgba(255,255,255,.35);
  animation:waveRipple 3s ease-in-out infinite;
}
@keyframes waveRipple{
  0%{transform:scaleX(1);opacity:.7;}
  50%{transform:scaleX(1.05);opacity:.9;}
  100%{transform:scaleX(1);opacity:.7;}
}
/* Coral */
.art-sea .coral{
  position:absolute;bottom:18px;
  background:var(--hibiscus);
  border-radius:50% 50% 30% 30%;
  animation:coralSway 4s ease-in-out infinite alternate;
  transform-origin:bottom center;
}
@keyframes coralSway{0%{transform:rotate(-5deg);}100%{transform:rotate(5deg);}}
/* Fish */
.art-sea .fish{
  position:absolute;font-size:18px;
  animation:fishSwim 6s linear infinite;
}
@keyframes fishSwim{0%{left:-40px;opacity:0;}10%{opacity:1;}90%{opacity:1;}100%{left:110%;opacity:0;}}
/* Sand */
.art-sea .sand{
  position:absolute;bottom:0;left:0;right:0;height:28px;
  background:linear-gradient(180deg,#d4c060,#b09030);
  border-radius:60% 60% 0 0 / 30px 30px 0 0;
}
/* Sea shell */
.art-sea .shell{position:absolute;bottom:4px;font-size:14px;}

/* --- SCENE 3: 夕暮れの沖縄 --- */
.art-sunset{background:linear-gradient(180deg,#1a0830 0%,#3d0d20 15%,#8B2040 30%,#cc4422 45%,#e87030 58%,#f4aa40 72%,#1a4a70 82%,#0a2050 100%);}
/* Sunset sun */
.art-sunset .setsun{
  position:absolute;top:55px;left:50%;transform:translateX(-50%);
  width:58px;height:58px;border-radius:50%;
  background:radial-gradient(circle,#fff5a0,#ffcc00,#ff8800,#dd4400);
  box-shadow:0 0 40px 18px rgba(255,120,20,.5);
}
/* Horizon glow */
.art-sunset .horizon{
  position:absolute;bottom:70px;left:0;right:0;height:30px;
  background:linear-gradient(180deg,rgba(255,120,30,.4),transparent);
}
/* Ocean */
.art-sunset .ocean{
  position:absolute;bottom:0;left:0;right:0;height:70px;
  background:linear-gradient(180deg,#1060a0,#082050);
}
/* Reflection */
.art-sunset .reflection{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  width:30px;
  background:linear-gradient(180deg,rgba(255,200,60,.7),transparent);
  animation:reflectWave 2s ease-in-out infinite alternate;
}
@keyframes reflectWave{0%{width:24px;opacity:.8;}100%{width:36px;opacity:.6;}}
/* Hibiscus flowers */
.art-sunset .hibiscus{position:absolute;font-size:22px;animation:hibiscusSway 5s ease-in-out infinite alternate;}
@keyframes hibiscusSway{0%{transform:rotate(-6deg) scale(1);}100%{transform:rotate(6deg) scale(1.05);}}
/* Sanshin silhouette */
.art-sunset .sanshin-wrap{
  position:absolute;bottom:62px;right:70px;
  animation:sanshinBob 4s ease-in-out infinite alternate;
}
@keyframes sanshinBob{0%{transform:translateY(0);}100%{transform:translateY(-5px);}}
.sanshin-body{width:12px;height:32px;background:#1a0a00;border-radius:3px 3px 0 0;margin:auto;}
.sanshin-head{width:18px;height:18px;background:#2a1008;border-radius:50%;margin:auto;}
.sanshin-neck{width:4px;height:20px;background:#1a0808;margin:auto;}
.sanshin-note{position:absolute;font-size:12px;top:-14px;left:14px;animation:noteFloat 3s ease-in-out infinite;}
@keyframes noteFloat{0%,100%{transform:translateY(0) rotate(-10deg);opacity:.8;}50%{transform:translateY(-8px) rotate(10deg);opacity:1;}}
/* Beach */
.art-sunset .beach{
  position:absolute;bottom:0;left:0;right:0;height:35px;
  background:linear-gradient(180deg,#c8a830,#8a7020);
  border-radius:70% 70% 0 0 / 30px 30px 0 0;
}

/* --- TITLE ART --- */
.art-title{
  height:220px;
  background:linear-gradient(180deg,#03061a 0%,#060d2a 25%,#0a1840 50%,#041520 75%,#02100a 100%);
}
/* Big moon */
.art-title .big-moon{
  position:absolute;top:20px;left:50%;transform:translateX(-50%);
  width:80px;height:80px;border-radius:50%;
  background:radial-gradient(circle at 40% 38%,#fffff8,#e8e060 50%,#b8a820);
  box-shadow:0 0 40px 16px rgba(230,220,80,.3);
}
/* Silhouette island */
.art-title .island{
  position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
  width:240px;height:60px;
  background:linear-gradient(180deg,#0a1c0a,#04100a);
  border-radius:60% 60% 0 0;
}
/* Palm trees on island */
.art-title .palm{position:absolute;bottom:90px;font-size:36px;}
/* Title ocean */
.art-title .t-ocean{
  position:absolute;bottom:0;left:0;right:0;height:42px;
  background:linear-gradient(180deg,#0a3060,#050d30);
}
/* Title reflection */
.art-title .t-ref{
  position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
  width:4px;height:32px;
  background:linear-gradient(180deg,rgba(220,210,70,.8),transparent);
  animation:reflectWave 2.5s ease-in-out infinite alternate;
  border-radius:2px;
}

.art-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,transparent 55%,rgba(0,0,0,.55) 100%);
  z-index:2;
}

/* ====== PLAYER CARD (main character) ====== */
.player-bar{
  display:flex;align-items:center;gap:12px;
  padding:10px 22px;
  background:linear-gradient(135deg,rgba(255,248,220,.06),rgba(40,130,120,.05));
  border-bottom:1px solid rgba(212,168,67,.12);
}
.player-avatar-wrap{position:relative;}
.player-avatar{
  width:46px;height:46px;border-radius:50%;
  background:linear-gradient(135deg,#3a6aaa,#1a3a80);
  border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;flex-shrink:0;
  box-shadow:0 0 12px rgba(212,168,67,.35);
}
.player-badge{
  position:absolute;bottom:-3px;right:-3px;
  width:16px;height:16px;border-radius:50%;
  background:var(--gold);color:var(--deep);
  font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--deep);
}
.player-info{flex:1;}
.player-name{font-size:13px;font-weight:700;color:var(--gold);}
.player-role{font-size:10px;color:rgba(255,255,255,.45);margin-top:1px;}
.player-status{
  font-size:10px;
  padding:3px 9px;border-radius:20px;
  border:1px solid rgba(46,200,100,.4);
  color:rgba(100,255,150,.8);
  background:rgba(46,200,100,.08);
}

/* ====== DIALOGUE ====== */
.dlg-section{padding:18px 22px;}
.npc-dlg{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;}
.npc-av{
  width:50px;height:50px;border-radius:50%;
  border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;flex-shrink:0;
  background:rgba(212,168,67,.1);
  box-shadow:0 0 10px rgba(212,168,67,.3);
  animation:avGlow 2s ease-in-out infinite alternate;
}
@keyframes avGlow{0%{box-shadow:0 0 7px rgba(212,168,67,.28);}100%{box-shadow:0 0 16px rgba(212,168,67,.6);}}
.npc-body{flex:1;}
.npc-nm{font-size:10px;color:var(--gold);font-weight:700;letter-spacing:.08em;margin-bottom:5px;}
.npc-txt{
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.1);
  border-radius:0 13px 13px 13px;
  padding:11px 15px;font-size:13.5px;line-height:1.85;
  color:rgba(255,255,255,.88);position:relative;
}
.npc-txt::before{
  content:'';position:absolute;left:-8px;top:11px;
  border:8px solid transparent;
  border-right-color:rgba(255,255,255,.055);
}

/* Player reply bubble */
.player-reply{
  display:flex;flex-direction:row-reverse;gap:12px;align-items:flex-start;
  margin-top:10px;
}
.p-av{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,#2a5090,#132060);
  border:2px solid rgba(100,160,255,.5);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
}
.p-txt{
  background:rgba(40,80,160,.2);
  border:1px solid rgba(100,150,255,.18);
  border-radius:13px 0 13px 13px;
  padding:9px 14px;font-size:12.5px;line-height:1.7;
  color:rgba(180,210,255,.9);
  font-style:italic;
}

.know-card{
  background:linear-gradient(135deg,rgba(46,139,130,.14),rgba(26,122,181,.09));
  border:1px solid rgba(46,139,130,.32);
  border-radius:13px;padding:13px 16px;
  margin-top:12px;font-size:12.5px;line-height:1.85;
  color:rgba(255,255,255,.78);
}
.know-title{
  font-size:10px;color:var(--teal);font-weight:700;
  letter-spacing:.12em;margin-bottom:5px;
  display:flex;align-items:center;gap:5px;
}

/* ====== QUIZ ====== */
.quiz-wrap{padding:0 22px 22px;}
.quiz-q{
  background:rgba(212,168,67,.075);
  border:1px solid rgba(212,168,67,.22);
  border-radius:13px;padding:15px 18px;margin-bottom:14px;
}
.q-header{display:flex;align-items:center;gap:7px;margin-bottom:9px;}
.q-badge{
  background:var(--gold);color:var(--deep);
  font-size:9px;font-weight:700;padding:2px 7px;
  border-radius:20px;letter-spacing:.07em;
}
.q-num{font-size:10px;color:rgba(255,255,255,.38);}
.q-text{font-size:14.5px;font-weight:700;color:#fff;line-height:1.65;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
@media(max-width:500px){.opts{grid-template-columns:1fr;}}
.opt{
  background:rgba(255,255,255,.048);
  border:1.5px solid rgba(255,255,255,.14);
  border-radius:11px;padding:11px 14px;
  font-size:12.5px;color:rgba(255,255,255,.83);
  cursor:pointer;text-align:left;
  transition:all .18s ease;
  font-family:'Noto Sans JP',sans-serif;
  line-height:1.5;position:relative;overflow:hidden;
}
.opt::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(212,168,67,.1),transparent);
  opacity:0;transition:opacity .18s;
}
.opt:hover:not(:disabled)::after{opacity:1;}
.opt:hover:not(:disabled){
  border-color:rgba(212,168,67,.48);
  transform:translateY(-2px);
  box-shadow:0 4px 14px rgba(212,168,67,.14);
}
.opt.correct{
  background:rgba(46,200,100,.19);border-color:#2EC864;
  color:#7FFFA0;animation:correctPop .45s ease;
}
.opt.wrong{
  background:rgba(232,96,76,.18);border-color:var(--coral);
  color:#FFAAAA;animation:shake .38s ease;
}
@keyframes correctPop{0%{transform:scale(1);}50%{transform:scale(1.04);}100%{transform:scale(1);}}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
.opt:disabled{cursor:default;}
.fb{
  margin-top:11px;padding:11px 15px;border-radius:11px;
  font-size:12.5px;line-height:1.75;display:none;animation:fbIn .35s ease;
}
.fb.show{display:block;}
.fb.fb-ok{background:rgba(46,200,100,.11);border:1px solid rgba(46,200,100,.28);color:#90FFB0;}
.fb.fb-ng{background:rgba(232,96,76,.11);border:1px solid rgba(232,96,76,.28);color:#FFBBBB;}
@keyframes fbIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}

/* ====== BUTTONS ====== */
.act{padding:0 22px 22px;display:flex;justify-content:center;gap:11px;flex-wrap:wrap;}
.btn-p{
  background:linear-gradient(135deg,var(--gold),#b87c08);
  color:var(--deep);border:none;border-radius:50px;
  padding:13px 34px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:'Noto Sans JP',sans-serif;
  transition:all .22s;box-shadow:0 4px 18px rgba(212,168,67,.32);
  letter-spacing:.05em;
}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 7px 26px rgba(212,168,67,.48);}
.btn-p:active{transform:translateY(0);}
.btn-p:disabled{
  background:rgba(255,255,255,.09);color:rgba(255,255,255,.28);
  box-shadow:none;cursor:not-allowed;transform:none;
}
.btn-s{
  background:transparent;color:rgba(255,255,255,.65);
  border:1.5px solid rgba(255,255,255,.18);
  border-radius:50px;padding:11px 26px;font-size:13px;
  cursor:pointer;font-family:'Noto Sans JP',sans-serif;
  transition:all .18s;
}
.btn-s:hover{border-color:rgba(255,255,255,.48);color:#fff;}

/* ====== TITLE SCREEN ====== */
.title-inner{text-align:center;padding:18px 22px 28px;}
.t-main{
  font-family:'Noto Serif JP',serif;
  font-size:clamp(20px,4.5vw,34px);
  color:var(--gold);
  text-shadow:0 0 28px rgba(212,168,67,.65),0 0 55px rgba(212,168,67,.3);
  line-height:1.3;margin:14px 0 6px;
}

.wave-bar:nth-child(4){animation-delay:.15s}
.wave-bar:nth-child(5){animation-delay:.20s}
.wave-bar:nth-child(6){animation-delay:.25s}

<body>

</div>

<script>
// ── STARS ──
(()=>{

    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--dur:${Math.random()*3+1.8}s;animation-delay:${Math.random()*4}s`;
    c.appendChild(s);

const PLAYER = { name:'王宇翔', nameJp:'オウ・ウショウ', emoji:'👨‍🎓' };

// ── STAGE DATA ──
const STAGES=[
{

    `ここは15世紀の首里城下町じゃ。\n琉球王国は中国・日本・東南アジアを\nつなぐ海上貿易で栄えた独立国家だったのじゃ。\n\n「万国津梁（ばんこくしんりょう）」——\nすべての国をつなぐ架け橋、という理念を持っておった。`,

    {type:'image', q:'🖼️ 下の絵を見てください。これは何という沖縄の伝統的な守護像ですか？',

{

const $=id=>document.getElementById(id);
function setCard(html){
  const c=$('card');
  c.innerHTML=html;
  c.style.animation='none';void c.offsetWidth;c.style.animation='';
  c.className='card';
}

function updProgress(){
  const total=ST.si*4+ST.qi;
  $('prog-fill').style.width=(total/12*100)+'%';
  $('score-lbl').textContent=`${ST.score}/12点`;
  [1,2,3].forEach(i=>{
    const d=$(`dot-${i}`);d.className='dot';
    if(i-1<ST.si)d.classList.add('done');
    else if(i-1===ST.si)d.classList.add('active');
  });
}

// ── WEB AUDIO: 音楽合成 ──
let audioCtx=null;
function getAudioCtx(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

// 三線音色：物理モデリング版
// 特徴：蛇皮の共鳴ノイズ層 + 鋭い倍音 + 素早いpluckエンベロープ
function playSanshinNote(ctx, freq, t, vol){
  const sr = ctx.sampleRate;

  // ── 1. Karplus-Strong 風プラック（弦の物理モデル）──
  const bufLen = Math.round(sr / freq);
  const ksBuffer = ctx.createBuffer(1, bufLen, sr);
  const ksData = ksBuffer.getChannelData(0);
  // ノイズで初期化
  for(let i=0;i<bufLen;i++) ksData[i] = Math.random()*2-1;
  const ksSrc = ctx.createBufferSource();
  ksSrc.buffer = ksBuffer;
  ksSrc.loop = true;

  // ローパスフィルタ（弦の減衰シミュレーション）
  const ksFilter = ctx.createBiquadFilter();
  ksFilter.type = 'lowpass';
  ksFilter.frequency.value = freq * 3.5;
  ksFilter.Q.value = 0.8;

  const ksGain = ctx.createGain();
  ksGain.gain.setValueAtTime(0, t);
  ksGain.gain.linearRampToValueAtTime(vol * 0.55, t + 0.005);
  ksGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);

  ksSrc.connect(ksFilter);
  ksFilter.connect(ksGain);
  ksGain.connect(ctx.destination);
  ksSrc.start(t);
  ksSrc.stop(t + 0.6);

  // ── 2. 倍音オシレータ群（三線の明るい音色）──
  // 基音
  const o1 = ctx.createOscillator();
  o1.type = 'sawtooth';
  o1.frequency.value = freq;
  const g1 = ctx.createGain();
  g1.gain.setValueAtTime(0, t);
  g1.gain.linearRampToValueAtTime(vol * 0.22, t + 0.008);
  g1.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);

  // 2倍音（三線の特徴的な明るさ）
  const o2 = ctx.createOscillator();
  o2.type = 'sawtooth';
  o2.frequency.value = freq * 2.0;
  const g2 = ctx.createGain();
  g2.gain.setValueAtTime(0, t);
  g2.gain.linearRampToValueAtTime(vol * 0.12, t + 0.006);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);

  // 3倍音
  const o3 = ctx.createOscillator();
  o3.type = 'triangle';
  o3.frequency.value = freq * 3.0;
  const g3 = ctx.createGain();
  g3.gain.setValueAtTime(0, t);
  g3.gain.linearRampToValueAtTime(vol * 0.06, t + 0.005);
  g3.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);

  // ハイパスでシャリ感
  const hpf = ctx.createBiquadFilter();
  hpf.type = 'highpass';
  hpf.frequency.value = freq * 0.8;

  [o1,o2,o3].forEach((o,i)=>{
    const g=[g1,g2,g3][i];
    o.connect(g); g.connect(hpf);
    o.start(t); o.stop(t+0.5);
  });
  hpf.connect(ctx.destination);

  // ── 3. 蛇皮共鳴ノイズ（サーッとした質感）──
  const noiseDur = 0.04;
  const nBuf = ctx.createBuffer(1, Math.ceil(sr * noiseDur), sr);
  const nData = nBuf.getChannelData(0);
  for(let i=0;i<nData.length;i++) nData[i] = (Math.random()*2-1) * Math.exp(-i/(sr*0.012));
  const nSrc = ctx.createBufferSource();
  nSrc.buffer = nBuf;
  const nBPF = ctx.createBiquadFilter();
  nBPF.type = 'bandpass';
  nBPF.frequency.value = freq * 1.5;
  nBPF.Q.value = 2.0;
  const nGain = ctx.createGain();
  nGain.gain.value = vol * 0.18;
  nSrc.connect(nBPF); nBPF.connect(nGain); nGain.connect(ctx.destination);
  nSrc.start(t);
}

function playSanshin(){
  const ctx = getAudioCtx();
  // 琉球音階：C D# F G A# C（沖縄音階 = 1,3,4,5,7）
  // 実際の三線チューニング: C F A# → メロディ展開
  const melody = [
    // イントロ：低弦ジャカジャカ
    {freq:261.6, t:0.00, v:0.9},   // C4
    {freq:349.2, t:0.20, v:0.8},   // F4
    {freq:440.0, t:0.40, v:0.85},  // A4
    {freq:523.3, t:0.60, v:0.9},   // C5
    // メインフレーズ
    {freq:587.3, t:0.90, v:0.85},  // D5
    {freq:523.3, t:1.15, v:0.7},   // C5
    {freq:440.0, t:1.35, v:0.75},  // A4
    {freq:349.2, t:1.55, v:0.8},   // F4
    // 返し
    {freq:392.0, t:1.85, v:0.85},  // G4
    {freq:440.0, t:2.05, v:0.9},   // A4
    {freq:523.3, t:2.25, v:0.85},  // C5
    {freq:587.3, t:2.45, v:0.75},  // D5
    // エンディング
    {freq:523.3, t:2.75, v:0.8},   // C5
    {freq:440.0, t:2.95, v:0.7},   // A4
    {freq:349.2, t:3.15, v:0.65},  // F4
    {freq:261.6, t:3.45, v:0.9},   // C4（締め）
  ];

  melody.forEach(n => playSanshinNote(ctx, n.freq, ctx.currentTime + n.t, n.v));

  setMusicLabel('三線の音色を聴いています♪');
  setTimeout(()=>setMusicLabel('もう一度聴くには再生ボタンを押してください'), 4200);
}

// エイサー太鼓リズム
function playEisa(){
  const ctx=getAudioCtx();
  // Pattern: kick kick snare kick kick snare x2
  const pattern=[0,0.25,0.5,0.75,1.0,1.25,1.5,1.75,2.0,2.25,2.5,2.75];
  const types=  ['k','k', 's', 'k', 'k', 's', 'k', 'k', 's', 'k', 'k', 's'];
  pattern.forEach((t,i)=>{
    const time=ctx.currentTime+t;
    if(types[i]==='k'){
      // 太鼓 kick
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type='sine'; osc.frequency.setValueAtTime(180,time);
      osc.frequency.exponentialRampToValueAtTime(40,time+0.15);
      gain.gain.setValueAtTime(0.7,time);
      gain.gain.exponentialRampToValueAtTime(0.001,time+0.2);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(time); osc.stop(time+0.25);
    } else {
      // スネア
      const buf=ctx.createBuffer(1,ctx.sampleRate*0.12,ctx.sampleRate);
      const data=buf.getChannelData(0);
      for(let j=0;j<data.length;j++) data[j]=(Math.random()*2-1)*Math.exp(-j/(ctx.sampleRate*0.04));
      const src=ctx.createBufferSource();
      const gain=ctx.createGain();
      src.buffer=buf; gain.gain.value=0.45;
      src.connect(gain); gain.connect(ctx.destination);
      src.start(time);
    }
  });
  setMusicLabel('エイサーの太鼓を聴いています🥁');
  setTimeout(()=>setMusicLabel('もう一度聴くには再生ボタンを押してください'),3500);
}

function playSound(key){
  const btn=document.getElementById('play-btn');
  if(btn){btn.disabled=true;btn.textContent='♪ 再生中...';}
  const wave=document.getElementById('music-wave');
  if(wave) wave.classList.add('playing');
  if(key==='sanshin') playSanshin();
  else if(key==='eisa') playEisa();
  const dur=key==='sanshin'?4500:3500;
  setTimeout(()=>{
    if(btn){btn.disabled=false;btn.textContent='▶ もう一度聴く';}
    if(wave) wave.classList.remove('playing');
  },dur);
}

function setMusicLabel(txt){
  const el=document.getElementById('music-label');
  if(el) el.textContent=txt;
}
